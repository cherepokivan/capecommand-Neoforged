plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.190'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = uri('https://repo.opencollab.dev/main/') }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
    compileOnly "org.geysermc.geyser:api:${project.geyser_api_version}"
}

sourceSets.main.resources.srcDir 'src/main/generated'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}


processResources {
    inputs.property 'version', project.version
    inputs.property 'neoforge_version', project.neoforge_version_range
    inputs.property 'neoforge_minecraft_version', project.minecraft_version_range
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_description', project.mod_description
    inputs.property 'modrinth_project_id', project.modrinth_project_id
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, mod_id: project.mod_id, mod_name: project.mod_name,
                mod_description: project.mod_description, modrinth_project_id: project.modrinth_project_id,
                github_repository: 'eclipseisoffline/capecommand', modrinth_id: project.modrinth_project_id,
                neoforge_version: project.neoforge_version_range,
                neoforge_minecraft_version: project.minecraft_version_range
    }
}


jar {
    manifest { attributes 'Specification-Title': project.mod_name, 'Specification-Vendor': 'eclipseisoffline' }
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
}
